name: Mobile release build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @khobra/mobile
      - run: npx expo-doctor
        working-directory: apps/mobile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 21.6.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas build --platform "${{ inputs.platform }}" --profile production --non-interactive --no-wait
        working-directory: apps/mobile
